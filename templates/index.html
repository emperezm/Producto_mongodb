<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5 mb-5">Gestión Ventas De Productos</h1>
    </div>
    <div class="container">
        <div class="row row-col-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-2">
            <div class="col-md-6 mb-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Inventario De Producto</h5>
                    </div>
                    <div class="card-body">
                        <form action="/products" method="POST">
                            <label>Nombre Producto</label>
                            <input type="text" class="form-control mb-3" name="nombre_producto"> <!-- Cambio aquí -->
                            <label>Precio</label>
                            <input type="text" class="form-control mb-3" name="precio"> <!-- Cambio aquí -->
                            <label>Cantidad</label>
                            <input type="text" class="form-control mb-3" name="cantidad"> <!-- Cambio aquí -->
                            <label>Descripción</label>
                            <input type="text" class="form-control mb-3" name="descripcion"> <!-- Cambio aquí -->
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="text-center">Lista De Productos</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <div class="row row-col-2 row-cols-sm-2 row-cols-md-3 row-cols-lg-3">
                                {% for product in products %}
                                <div class="col">
                                    <li class="list-group-item mb-3">
                                        <form action="/edit/{{ product.nombre_producto }}" method="POST"> <!-- Cambio aquí -->
                                            <input type="text" class="form-control" value="{{ product.nombre_producto }}" name="nombre_producto"> <!-- Cambio aquí -->
                                            <small>Cantidad</small>
                                            <input type="text" class="form-control" value="{{ product.cantidad }}" name="cantidad"> <!-- Cambio aquí -->
                                            <small>Precio</small>
                                            <input type="text" class="form-control" value="{{ product.precio }}" name="precio"> <!-- Cambio aquí -->
                                            <small>Descripción</small>
                                            <input type="text" class="form-control" value="{{ product.descripcion }}" name="descripcion"> <!-- Cambio aquí -->
                                            <button class="btn btn-primary btn-sm" type="submit">Editar</button>
                                            <a href="{{ url_for('delete_product', product_name=product.nombre_producto) }}" class="btn btn-danger btn-sm">Eliminar</a> <!-- Cambio aquí -->
                                        </form>
                                    </li>
                                </div>
                                {% endfor %}
                            </div>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
