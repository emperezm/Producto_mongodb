<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="200" cy="200" r="180" fill="#f0f9ff"/>
  
  <!-- Caja/inventario principal -->
  <rect x="120" y="120" width="160" height="160" rx="15" fill="#3b82f6" stroke="#1e40af" stroke-width="8"/>
  
  <!-- Líneas de la caja (estantes) -->
  <line x1="120" y1="180" x2="280" y2="180" stroke="white" stroke-width="6"/>
  <line x1="120" y1="240" x2="280" y2="240" stroke="white" stroke-width="6"/>
  
  <!-- Elementos de inventario (pequeñas cajas) -->
  <rect x="140" y="140" width="30" height="25" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="185" y="145" width="30" height="20" rx="3" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
  <rect x="230" y="135" width="30" height="30" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  
  <rect x="150" y="195" width="25" height="30" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <rect x="200" y="200" width="20" height="25" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <rect x="240" y="195" width="20" height="30" rx="3" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
  
  <rect x="145" y="255" width="30" height="15" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <rect x="190" y="250" width="25" height="25" rx="3" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <rect x="235" y="255" width="25" height="20" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  
  <!-- Ícono de lista/verificación -->
  <circle cx="320" cy="130" r="40" fill="#3b82f6" stroke="#1e40af" stroke-width="5"/>
  <polyline points="300,130 315,145 340,115" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Texto circular abstracto que representa sistema -->
  <path id="curve" d="M 50,200 A 150,150 0 0,1 350,200" fill="transparent"/>
  <text font-family="Arial" font-size="0">
    <textPath href="#curve">SISTEMA DE INVENTARIO</textPath>
  </text>
</svg>
